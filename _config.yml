title: MediaForge
description: >-
  Use FFmpeg on macOS without the command line. MediaForge is a free,
  open-source desktop FFmpeg GUI with visual presets to export video, make
  high-quality GIFs, extract audio, and convert WebP locally.
url: "https://www.mediaforgeapp.com"
baseurl: ""

permalink: pretty

# macOS download points at GitHub's rolling latest release page
release:
  macos_dmg: "https://github.com/mediaforgeapp/mediaforge/releases/latest"

github_repo: "https://github.com/mediaforgeapp/mediaforge"
github_releases: "https://github.com/mediaforgeapp/mediaforge/releases"
support_email: "support@mediaforgeapp.com"

# Builtly SaaS backend (auth / credits / Stripe checkout)
builtly:
  api_base: "https://builtly.appootb.dev/api/v1"
  app_id: "01a187d6-b42f-7988-ade5-05a50543d2cf"
  auth_redirect: "/auth/callback/"
  checkout_success: "/billing/thanks/"
  checkout_cancel: "/pricing/"

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - .ruby4_boot.rb
  - script
  - .github

# Disable the default github-pages Primer theme; this site is fully custom.
theme: null

# github-pages may force safe mode online; keep local builds flexible.
safe: false
plugins:
  - jekyll-sitemap
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
