{% include locale-setup.html %}
{% assign g = t.gallery %}

<main>
  <section class="container pt-24 pb-24 sm:pt-28 sm:pb-32">
    <div class="space-y-3 mx-auto max-w-3xl text-center">
      {% if g.eyebrow %}
      <div class="text-xs font-medium tracking-[0.22em] text-[#FF6F00] uppercase">{{ g.eyebrow }}</div>
      {% endif %}
      <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">{{ g.title }}</h1>
      {% if g.lead %}
      <p class="text-base leading-relaxed text-white/70 sm:text-lg">{{ g.lead }}</p>
      {% endif %}
    </div>

    <div class="mx-auto mt-12 max-w-lg text-center sm:mt-16">
      <div class="border-foreground/10 bg-card/50 relative overflow-hidden rounded-2xl border p-8 shadow-sm backdrop-blur sm:p-10">
        <div
          aria-hidden="true"
          class="pointer-events-none absolute inset-0 opacity-90"
          style="background: radial-gradient(circle at 20% 0%, rgba(255,111,0,0.14), transparent 55%), radial-gradient(circle at 90% 50%, rgba(255,111,0,0.08), transparent 58%);"
        ></div>
        <div class="relative">
          <div class="border-foreground/10 bg-background/70 text-primary mx-auto mb-5 flex size-12 items-center justify-center rounded-xl border shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>
          </div>
          <p class="text-muted-foreground text-sm leading-relaxed sm:text-base">{{ g.body }}</p>
          {% if g.cta %}
          <a
            href="{{ url_download }}"
            class="bg-primary text-primary-foreground mt-8 inline-flex h-10 items-center justify-center rounded-lg px-5 text-sm font-medium shadow-md ring-1 ring-black/10 hover:bg-primary/92 transition-colors duration-200"
          >{{ g.cta.title }}</a>
          {% endif %}
        </div>
      </div>
    </div>
  </section>
</main>
