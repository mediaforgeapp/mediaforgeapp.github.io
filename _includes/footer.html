<footer id="footer" class="relative z-10 py-8 sm:py-10">
  <div class="container space-y-8">
    <div class="grid min-w-0 gap-12 md:grid-cols-5">
      <div class="min-w-0 space-y-4 break-words md:col-span-2 md:space-y-6">
        <a class="flex items-center space-x-3" href="{{ url_home }}">
          <img alt="MediaForge" width="32" height="32" class="h-8 w-8 rounded-xl object-cover" src="{{ '/assets/images/logo.png' | relative_url }}" />
          <span class="text-lg font-semibold tracking-tight text-white">MediaForge</span>
        </a>
        <p class="text-muted-foreground text-sm text-balance break-words">
          {{ t.footer.description }}
        </p>
      </div>
      <div class="col-span-3 grid min-w-0 gap-6 sm:grid-cols-3"></div>
    </div>

    <div class="flex min-w-0 flex-wrap items-center gap-4 sm:gap-8">
      <div class="min-w-0 flex-1"></div>
      {% include locale-selector.html type="button" %}
    </div>

    <div aria-hidden="true" class="h-px min-w-0 [background-image:linear-gradient(90deg,var(--color-foreground)_1px,transparent_1px)] bg-[length:6px_1px] bg-repeat-x opacity-25"></div>

    <div class="flex min-w-0 flex-wrap justify-between gap-8">
      <div class="text-muted-foreground text-sm">
        © {{ 'now' | date: '%Y' }}
        <a href="{{ url_home }}" class="text-primary hover:text-primary/80 cursor-pointer">MediaForge</a>, {{ t.footer.copyright_suffix }}
      </div>
      <div class="min-w-0 flex-1"></div>
      <div class="flex min-w-0 flex-wrap items-center gap-4">
        <a class="text-muted-foreground hover:text-primary block text-xs break-words underline duration-150" href="{{ url_privacy }}">{{ t.footer.privacy }}</a>
        <a class="text-muted-foreground hover:text-primary block text-xs break-words underline duration-150" href="{{ url_terms }}">{{ t.footer.terms }}</a>
      </div>
      <div class="flex min-w-0 flex-wrap items-center gap-2">
        <a target="_blank" rel="noopener noreferrer" class="text-muted-foreground hover:text-primary border-foreground/10 bg-card/60 hover:bg-card/75 block cursor-pointer rounded-full border p-2 shadow-sm backdrop-blur transition-colors duration-150" aria-label="Github" href="{{ site.github_repo }}">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
        </a>
        <a class="text-muted-foreground hover:text-primary border-foreground/10 bg-card/60 hover:bg-card/75 block cursor-pointer rounded-full border p-2 shadow-sm backdrop-blur transition-colors duration-150" aria-label="Email" href="mailto:{{ site.support_email }}">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
        </a>
      </div>
    </div>
  </div>
</footer>
